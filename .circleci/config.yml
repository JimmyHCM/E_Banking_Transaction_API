version: 2.1

# ─────────────────────────────────────────────────────────────────────────────
# CI for the e-Banking Transaction API.
#
# Runs unit tests (Surefire) AND the Testcontainers integration test (Failsafe,
# TransactionFlowIT) in a single `./mvnw clean verify`.
#
# We use the `machine` executor rather than a `docker` executor because the
# integration test spins up real Kafka + PostgreSQL containers via Testcontainers,
# which needs a local Docker daemon with host port mapping — something
# setup_remote_docker does not provide reliably.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build-and-test:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    environment:
      JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
      # Make the JVM respect the CI container's memory limits.
      MAVEN_OPTS: -XX:MaxRAMPercentage=70.0
      # Point docker-java (used by Testcontainers) straight at the local daemon
      # socket. The machine executor has Docker, but Testcontainers' auto-detection
      # can fail to validate it ("Could not find a valid Docker environment");
      # setting DOCKER_HOST explicitly forces the correct strategy.
      DOCKER_HOST: unix:///var/run/docker.sock
      # Ryuk (the Testcontainers resource reaper) is unnecessary on an ephemeral CI
      # VM that is destroyed after the job, and disabling it avoids reaper startup
      # flakiness.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - checkout

      - run:
          name: Install Temurin JDK 21
          command: |
            sudo mkdir -p /etc/apt/keyrings
            wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public \
              | sudo gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg
            echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(awk -F= '/^VERSION_CODENAME/{print$2}' /etc/os-release) main" \
              | sudo tee /etc/apt/sources.list.d/adoptium.list
            sudo apt-get update
            sudo apt-get install -y temurin-21-jdk
            echo 'export JAVA_HOME=/usr/lib/jvm/temurin-21-jdk-amd64' >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> "$BASH_ENV"

      - run:
          name: Verify Java and Docker
          command: |
            java -version
            sudo systemctl start docker || true
            docker version
            # No `| head`: under `pipefail` a closed pipe makes docker info exit 141.
            docker info

      - restore_cache:
          keys:
            - maven-v1-{{ checksum "pom.xml" }}
            - maven-v1-

      - run:
          name: Build, unit tests + integration tests
          command: ./mvnw -B -ntp clean verify

      - save_cache:
          key: maven-v1-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2/repository

      # Collect only the JUnit report XMLs into a clean directory. The Failsafe
      # plugin also writes a `failsafe-summary.xml` into target/failsafe-reports/,
      # which is NOT a JUnit document and makes store_test_results fail with
      # "invalid top level element: failsafe-summary" — so we copy TEST-*.xml only.
      # Runs on success or failure so results are always uploaded.
      - run:
          name: Collect JUnit results
          command: |
            mkdir -p ~/test-results/junit
            find . -path '*/target/surefire-reports/TEST-*.xml' -exec cp {} ~/test-results/junit/ \; 2>/dev/null || true
            find . -path '*/target/failsafe-reports/TEST-*.xml' -exec cp {} ~/test-results/junit/ \; 2>/dev/null || true
          when: always

      - store_test_results:
          path: ~/test-results/junit

      # Keep the JaCoCo coverage report and the built jar as build artifacts.
      - store_artifacts:
          path: target/site/jacoco
          destination: coverage
      - store_artifacts:
          path: target
          destination: build
          # The jar lives at target/*.jar; "build" keeps it alongside reports.

workflows:
  ci:
    jobs:
      - build-and-test
