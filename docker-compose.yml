# ───────────────────────────────────────────────────────────────────────────
# Self-contained local stack for the e-Banking Transaction API.
#
#   docker compose up --build
#
# Brings up Postgres, a single-node Kafka (KRaft), a WireMock FX-rate stub, and
# the application on the `local` Spring profile (HMAC-signed JWTs — see README).
# ───────────────────────────────────────────────────────────────────────────
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: txuser
      POSTGRES_PASSWORD: txpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txuser -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # External FX-rate provider stand-in. Returns a fixed rate table for any
  # request path, so cross-currency totals work in the demo without a real
  # third-party account. (The rates are illustrative, not directional.)
  fx-stub:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8081:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fx-stub:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/transactions
      DB_USER: txuser
      DB_PASSWORD: txpass
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: transactions
      FX_API_BASE_URL: http://fx-stub:8080
      LOCAL_JWT_SECRET: local-dev-secret-please-change-0123456789-abcdefghij
